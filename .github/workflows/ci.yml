name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these same checks on the tagged commit.
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to check.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  daemon:
    name: Daemon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Vet and test
        run: make test
      - name: Build release tarballs
        run: make dist

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Lint, test and build
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-reports
          path: |
            app/build/reports
            app/build/outputs/roborazzi
          retention-days: 7
      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  package:
    name: AUR package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Build and lint the package in an Arch container
        run: docker run --rm -v "$PWD:/repo:ro" archlinux:base-devel /repo/packaging/aur/test.sh
